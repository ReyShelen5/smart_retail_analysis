name: smart-retail

x-streaming-image: &streaming-image
  build:
    context: .
    dockerfile: docker/streaming.Dockerfile
  image: smart-retail/streaming:latest

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        KT="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092"
        $$KT --create --if-not-exists --topic sales-transactions --partitions 3 --replication-factor 1
        $$KT --create --if-not-exists --topic restock-alerts --partitions 1 --replication-factor 1
        $$KT --list
    restart: "no"

  consumer:
    <<: *streaming-image
    container_name: retail-consumer
    command: ["python", "kafka/consumer/consumer.py"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./data/inventory:/app/data/inventory:ro
      - ./data/streaming:/app/data/streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  producer:
    <<: *streaming-image
    container_name: retail-producer
    command: ["python", "kafka/producer/producer.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TX_RATE: "${TX_RATE:-5}"
      TX_COUNT: "${TX_COUNT:-0}"
    volumes:
      - ./data/historical:/app/data/historical:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      consumer:
        condition: service_started
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smart-retail
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
