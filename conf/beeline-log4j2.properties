status = ERROR
name = BeelineLog4j2
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{2}: %m%n
rootLogger.level = ERROR
rootLogger.appenderRef.console.ref = console

# Show the real cause when a local MapReduce job fails
logger.mapred.name = org.apache.hadoop.mapred
logger.mapred.level = WARN
logger.mr.name = org.apache.hadoop.hive.ql.exec.mr
logger.mr.level = WARN
